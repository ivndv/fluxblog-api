# FluxBlog API CI/CD — lint -> test -> deploy (solo push a main)
# Flujo: Cualquier push o PR a main/develop ejecuta lint y pruebas en paralelo; deploy solo se dispara en push a main con todo en verde.
# El deploy llama al webhook de Dokploy por HTTPS con un Service Token de Cloudflare Access (no usa SSH).

name: Blog Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Cancela ejecuciones previas del mismo ref, excepto deploys en main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Permisos mínimos: solo lectura del repositorio
permissions:
  contents: read

jobs:
  # Job 1: Análisis estático con ESLint (Next.js linter)
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

  # Job 2: Pruebas unitarias y de integración con Vitest (paralelo a lint)
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  # Job 3: Despliegue automático en Dokploy (VPS) — solo si lint y test pasaron con éxito en rama main
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Sin SSH: el webhook se llama por HTTPS y Cloudflare Access lo autentica
      # con un Service Token acotado a /api/deploy/*.
      - name: Deploy via Dokploy webhook (Cloudflare Access)
        env:
          DOKPLOY_DEPLOY_TOKEN: ${{ secrets.DOKPLOY_DEPLOY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -X POST "https://dokploy.fluxdv.icu/api/deploy/${DOKPLOY_DEPLOY_TOKEN}" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-github-event: push" \
            -H "content-type: application/json" \
            -d '{"ref":"refs/heads/main","commits":[{"added":[],"modified":["README.md"],"removed":[]}],"head_commit":{"message":"Deploy from CI"}}'
          echo
          echo "Deploy solicitado a Dokploy."

  # ---------------------------------------------------------------------------
  # Escaneo de secretos. Workflow reutilizable definido en ivndv/.github
  # ---------------------------------------------------------------------------
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
