# FluxBlog API CI/CD — lint -> test -> deploy (solo push a main)
# Flujo: Cualquier push o PR a main/develop ejecuta lint y pruebas en paralelo; deploy solo se dispara en push a main con todo en verde.

name: Blog Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Análisis estático con ESLint (Next.js linter)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

  # Job 2: Pruebas unitarias y de integración con Vitest (paralelo a lint)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  # Job 3: Despliegue automático en Dokploy (VPS) — solo si lint y test pasaron con éxito en rama main
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Dokploy API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "Iniciando despliegue de blog-backend en Dokploy vía API..."
            curl -X POST 'http://localhost:3000/api/application.deploy' \
              -H 'Content-Type: application/json' \
              -H 'x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}' \
              -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID }}"}'
            echo "¡Despliegue completado exitosamente!"
