# FluxBlog API CI/CD — lint -> test -> deploy (solo push a main)
# Flujo: Cualquier push o PR a main/develop ejecuta lint y pruebas en paralelo; deploy solo se dispara en push a main con todo en verde.

name: Blog Backend CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  # Job 1: Análisis estático con ESLint (Next.js linter)
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Lint
        run: bun run lint

  # Job 2: Pruebas unitarias y de integración con Vitest (paralelo a lint)
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reutiliza el entorno Node/Bun con caché de dependencias
      - name: Setup Bun env
        uses: ./.github/actions/setup

      - name: Run tests
        run: bun run test

  # Job 3: Despliegue automático en Dokploy (VPS) — solo si lint y test pasaron con éxito en rama main
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via Dokploy API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -euo pipefail
            DOKPLOY_TOKEN="${{ secrets.DOKPLOY_DEPLOY_TOKEN }}"
            C=$(docker ps -q --filter name=dokploy | while read id; do
              img=$(docker inspect -f '{{.Config.Image}}' "$id")
              case "$img" in
                *dokploy/dokploy*) echo "$id"; break ;;
              esac
            done)
            if [ -z "$C" ]; then
              echo "No se encontró el contenedor de Dokploy"
              exit 1
            fi
            docker exec -e DOKPLOY_TOKEN="$DOKPLOY_TOKEN" "$C" node -e '
              const token = process.env.DOKPLOY_TOKEN;
              const payload = {
                ref: "refs/heads/main",
                commits: [{ added: [], modified: ["README.md"], removed: [] }],
                head_commit: { message: "Deploy from CI" }
              };
              fetch(`http://localhost:3000/api/deploy/${token}`, {
                method: "POST",
                headers: { "x-github-event": "push", "content-type": "application/json" },
                body: JSON.stringify(payload)
              })
                .then(async (res) => {
                  console.log("Dokploy:", res.status, await res.text());
                  process.exit(res.ok ? 0 : 1);
                })
                .catch((error) => {
                  console.error(error);
                  process.exit(1);
                });
            '
            echo "Deploy solicitado a Dokploy."
